name: Build APK from zip
on:
  push: { branches: [main, master] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -q prottasha-academy-app.zip
          ls -la prottasha-app
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install and add Android
        working-directory: prottasha-app
        run: |
          npm install
          npx cap add android
      - name: Notification icon
        working-directory: prottasha-app
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/ic_stat_logo.xml android/app/src/main/res/drawable/ic_stat_logo.xml
      - name: Apply your logo (launcher icon + splash screen)
        working-directory: prottasha-app
        run: |
          res=android/app/src/main/res
          find $res -name 'splash.png' -delete
          cp -r resources/android-res/. $res/
          echo "--- icons installed:"; ls -la $res/mipmap-xxxhdpi $res/mipmap-anydpi-v26 $res/drawable || true
      - name: Permissions (camera, microphone, notifications)
        working-directory: prottasha-app
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" $f || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' $f
          grep -n "permission" $f
      - name: Sync
        working-directory: prottasha-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: prottasha-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Prottasha-Academy-APK
          path: prottasha-app/android/app/build/outputs/apk/debug/app-debug.apk
